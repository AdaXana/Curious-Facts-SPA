<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curious Facts🔍</title>
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>
    <main class="global-container">
        <img class="header-logo" src="/src/assets/images/dyk.png" alt="Did You Know?">
        <section class="fact-container" id="fact-container-display">
            <p class="fact-description-display" id="fact-description-display"></p>
        </section>
        <section class="menu-btns-container">
            <button class="btn" id="btn-other-fact" aria-label="Show other fact">Show other fact</button>
            <button class="btn" id="btn-add-favs" aria-label="Add to favorites">Add to favorites</button>
            <button class="btn" id="btn-show-favs" aria-label="Show favorites list">Show favorites list</button>
        </section>
        <section class="favorites-container" id ="favorites-container" style="display:none;">
            <div class="favorites">
                <table class="favorites-table">
                    <thead class="table-head">
                        <tr>
                            <th>Favorites Facts</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody class="table-body" id="favorites-table-body">
                    </tbody>
                </table>
            </div>
        </section>
    </mai>
    <script src="/src/js/app.js" type="module"></script>
</body>

</html>
