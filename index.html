<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curious Facts🔍</title>
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>
    <main class="global-container">
        <h1>Welcome to Curious Facts🔍</h1>
        <div class="first-fact" id="first-fact">Show me a fact!</div>
        <section class="fact-container" id="fact-display-module">
            <h3 class="fact-title"></h3>
            <p class="fact-description-display"></p>
        </section>
        <section class="menu-btns-container">
            <button class="btn" id="btn-other-fact">Show Other Fact</button>
            <button class="btn" id="btn-add-favs">Add to Favorites</button>
            <button class="btn" id="btn-show-favs">Show Favorites</button>
        </section>
        <section class="favorites-container">
            <div class="favorites">
                <table class="favorites-table">
                    <thead class="table-head">
                        <tr>
                            <th>Favorite Fact</th>
                            <th>View</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody class="table-body" id="favorites-table-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="./src/js/script.js"></script>
</body>

</html>
